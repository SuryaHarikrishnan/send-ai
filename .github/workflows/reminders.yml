name: Reminders

# Every hour, ask the live site to send any reminders that are due. GitHub often runs
# scheduled jobs hours late, so supabase/reminders-cron.sql is the main timer; this is a backup.
# Needs the repository secret CRON_SECRET (Settings > Secrets and variables > Actions),
# set to the same value as CRON_SECRET in Vercel.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

concurrency:
  group: reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send due reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then echo "CRON_SECRET isn't set, skipping."; exit 0; fi
          curl -sS --fail-with-body --max-time 120 \
            -H "Authorization: Bearer $CRON_SECRET" \
            https://justsend.fit/api/notify
